name: Deploy Aposis FE

on:
  push:
    branches:
      - production

env:
  ECR_REPOSITORY: aposis-fe-v2-repo
  TEMPLATE_FILE: deployment/cloudformation.yml
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        run: |
          aws ecr get-login-password --region ${{ vars.AWS_REGION }} | docker login --username AWS --password-stdin $(aws sts get-caller-identity --query Account --output text).dkr.ecr.$AWS_REGION.amazonaws.com

      - name: Build and Tag Docker Image
        run: |
          IMAGE_TAG=$(date +%s)  # Use timestamp as the tag
          REPO_URI=$(aws ecr describe-repositories --repository-names $ECR_REPOSITORY --query "repositories[0].repositoryUri" --output text)
          docker run --privileged --rm tonistiigi/binfmt --install all
          docker buildx create --use
          docker buildx build --platform linux/arm64 \
              --build-arg VITE_APP_URL=${{ vars.VITE_APP_URL }} \
              --build-arg VITE_BACKEND_URL=${{ env.BRANCH_NAME == 'production' && vars.BACKEND_URL || vars.STAGING_BACKEND_URL }} \
              --build-arg VITE_PAGE_LANDING=${{ env.BRANCH_NAME == 'production' && vars.VITE_PAGE_LANDING || vars.STAGING_VITE_PAGE_LANDING }} \
              --build-arg VITE_CLERK_PUBLISHABLE_KEY=${{ env.BRANCH_NAME == 'production' && vars.VITE_CLERK_PUBLISHABLE_KEY || vars.STAGING_VITE_CLERK_PUBLISHABLE_KEY }} \
              --build-arg VITE_APP_ENV=${{ env.BRANCH_NAME == 'production' && 'production' || 'staging' }} \
              --build-arg NODE_ENV=production \
              -t $REPO_URI:$IMAGE_TAG --push .
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "REPO_URI=$REPO_URI" >> $GITHUB_ENV

      - name: Deploy CloudFormation Stack
        run: |
          aws cloudformation deploy \
            --stack-name ${{ env.BRANCH_NAME == 'production' && 'ecs-aposis-fe-v2' || 'staging-ecs-aposis-fe-v2' }} \
            --template-file $TEMPLATE_FILE \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
                ImageUri=$REPO_URI:$IMAGE_TAG \
                Environment=${{ env.BRANCH_NAME }}
