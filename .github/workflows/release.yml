name: Release & Tag Version

on:
  push:
    branches:
      - production

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Tag & Release Package
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/production'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build:package

      - name: Get version from package.json
        id: pkg_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check_tag
        run: |
          TAG="${{ steps.pkg_version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag $TAG already exists, skipping tag creation."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag $TAG does not exist. Will create and release tag."
          fi

      - name: Create Git Tag and Push
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          TAG="${{ steps.pkg_version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG (Aposis V3 Design System)"
          git push origin "$TAG"

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg_version.outputs.tag }}
          name: Release ${{ steps.pkg_version.outputs.tag }}
          body: |
            ## 💠 Aposis V3 Design System - ${{ steps.pkg_version.outputs.tag }}

            ### 📦 Cara Install di Repositori Konsumen:
            ```bash
            # Menggunakan Git URL dengan tag ${{ steps.pkg_version.outputs.tag }}:
            npm install github:qompeten-org/aposis_v3_design_system#${{ steps.pkg_version.outputs.tag }}
            ```

            ### 🎨 Impor Komponen & Style:
            ```tsx
            import { Button, Input, Card, Navbar } from '@aposis/design-system';
            import '@aposis/design-system/style.css';
            ```
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
